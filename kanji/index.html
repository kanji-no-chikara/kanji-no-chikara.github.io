<style>
  :root{
    --board:#2C5545; --band:#24483A; --chalk:#FDFBF2; --chalkFaded:#C9D6C0;
    --gold:#F7C948; --ink:#23261F; --ink2:#5C6157; --line:#E2DDCE; --bg:#F7F5EE;
    --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181A; --ink:#ECEFEA; --ink2:#A3A9A2; --line:#333A38; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
       line-height:1.85;-webkit-text-size-adjust:100%}
  header{background:var(--board);color:var(--chalk);padding:22px 20px}
  header .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header .app{font-size:19px;font-weight:700}
  header nav{margin-left:auto;display:flex;gap:14px;font-size:14px}
  header nav a{color:var(--chalkFaded);text-decoration:none;border-bottom:1px solid transparent}
  header nav a:hover,header nav a[aria-current]{color:var(--gold);border-color:var(--gold)}
  main{max-width:720px;margin:0 auto;padding:32px 20px 72px}
  h1{font-size:26px;margin:0 0 6px;text-wrap:balance}
  h2{font-size:17px;margin:34px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  p{margin:0 0 14px}
  ul{margin:0 0 14px;padding-left:1.3em}
  li{margin-bottom:6px}
  a{color:#1F6F4A}
  @media (prefers-color-scheme: dark){ a{color:#8FD3AE} }
  footer{max-width:720px;margin:0 auto;padding:0 20px 48px;color:var(--ink2);font-size:13px}
  hr{border:0;border-top:1px solid var(--line);margin:32px 0}
</style>
</head>
