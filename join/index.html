<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部屋に招待されました | 漢字の力</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --board:#2C5545; --band:#24483A; --chalk:#FDFBF2; --chalkFaded:#C9D6C0;
    --gold:#F7C948; --ink:#23261F;
    --font:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--board);color:var(--chalk);font-family:var(--font);
       display:flex;align-items:center;justify-content:center;-webkit-text-size-adjust:100%}
  main{width:100%;max-width:420px;padding:32px 16px;text-align:center}
  .app{font-size:15px;color:var(--chalkFaded);margin:0 0 6px}
  h1{font-size:22px;margin:0 0 24px}
  .lead{font-size:15px;color:var(--chalkFaded);line-height:1.8;margin:0 0 24px}
  .btn{display:block;border-radius:999px;padding:16px;font-size:17px;font-weight:700;text-decoration:none;margin:0 0 14px}
  .primary{background:var(--gold);color:var(--ink)}
  .note{font-size:14px;color:var(--chalk);line-height:1.8;margin:8px 0 32px}
  .sub{font-size:13px;color:var(--chalkFaded);line-height:1.9;margin:0}
  .sub .code{font:700 15px ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--chalk)}
  .sub a{color:var(--chalkFaded)}
</style>
</head>
<body>
<main>
  <p class="app">漢字の力</p>
  <h1>部屋に招待されました</h1>
  <p class="lead">遊ぶにはアプリが必要です</p>
  <a class="btn primary" href="https://apps.apple.com/jp/app/id6800003825">App Store で入手</a>
  <p class="note">入れたら、もう一度このリンクを開いてください</p>
  <p class="sub" id="codeLine" hidden>部屋コード <span class="code" id="code">------</span></p>
  <p class="sub">アプリを入れているのに開かないときは <a id="open" href="kanjinochikara://join">アプリで開く</a></p>
</main>
<script>
  // 部屋コードに使う字だけを残す（アプリの RoomCode.alphabet と同じ）
  var alphabet = "ACDEFGHJKMNPQRTUVWXY2345679";
  var raw = (new URLSearchParams(location.search).get("c") || "").toUpperCase();
  var code = raw.split("").filter(function (ch) { return alphabet.indexOf(ch) >= 0; }).join("").slice(0, 6);
  if (code.length === 6) {
    document.getElementById("code").textContent = code.slice(0, 3) + " " + code.slice(3);
    document.getElementById("open").href = "kanjinochikara://join?c=" + code;
    document.getElementById("codeLine").hidden = false;
  }
</script>
</body>
</html>
